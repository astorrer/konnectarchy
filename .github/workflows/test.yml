name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - name: Lint
        run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install PyGObject for the D-Bus modules
        run: sudo apt-get update && sudo apt-get install -y python3-gi
      - name: Run unit tests
        run: ./tests/run
